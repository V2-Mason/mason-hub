# Mason Hub Agent 名册 — Single Source of Truth
#
# 更新规则：
#   决策权：Mason 确认新 agent 立项时更新
#   操作权：EMP_0000 (Meta Manager) 执行更新
#   同步：optimization-cycle.sh Gate 2 动态读取此文件
#
# status 说明：
#   active      — 当前在用
#   deprecated  — 已废弃（保留历史记录，不出现在合法清单中）
#   on-demand   — 按需激活，不常驻

agents:
  - id: EMP_0000
    name: Meta Manager
    role: 跨域总调度，Mason 的主要 AI 对接人
    domain: meta
    status: active
    can_own_tasks: false  # 协调者，不直接执行

  - id: EMP_0001
    name: 素仁轩 PM
    role: 素仁轩项目管理
    domain: ecommerce
    status: active
    can_own_tasks: true

