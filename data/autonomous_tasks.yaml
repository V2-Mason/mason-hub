# autonomous_tasks.yaml — Dispatcher 自主任务注册表
#
# Mason 批准后添加到此文件，Dispatcher 自动扫描执行。
# 完成检测：backlog 中匹配 backlog_match 的行是否已标 [x]
#
# 字段说明：
#   id:              唯一标识符
#   agent:           执行 agent 的配置文件路径（相对 mason-hub）
#   line:            所属能力线（需要状态为 active 才执行）
#   backlog_match:   backlog.md 中匹配的关键词（用于检测是否已完成）
#   description:     任务描述（传给 agent 的 prompt）
#   priority:        P0 > P1 > P2（同优先级按注册顺序）
#
# 结构化字段（可选，向后兼容）：
#   expected_output: agent 应该产出什么（注入 prompt，让 agent 知道成功标准）
#   verify_command:  验证成功的 shell 命令（exit 0 = 成功），空 = 信任 agent 自报
#   output_path:     结果文件路径（dispatcher 检查是否存在）
#   max_duration:    超时秒数（0 = 不限）
#   depends_on:      依赖的前序 task ID（逗号分隔，全部完成才执行）
#   context_files:   需要注入 context 的文件路径（逗号分隔，替代默认 knowledge 注入）
#   task_type:       execute（默认，完整注入）| query（轻量，不注入收工/gene）| repair（只注入语义搜索+context_files）

tasks:
  # === 自治线 ===
  - id: searxng-docker
    agent: agents/EMP_0002/config.md
    line: 自治线
    backlog_match: "SearXNG Docker 部署"
    description: "部署 SearXNG Docker 实例到 GCP，配置 --restart always，验证 localhost:8888 可用"
    priority: P1
    task_type: execute
    verify_command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8888 | grep -q 200"
    max_duration: 600

  - id: agent-four-layer
    agent: agents/EMP_0002/config.md
    line: 自治线
    backlog_match: "Agent .md 四层声明补齐"
    description: "补齐剩余 8 个 agent 的四层声明（触发→前置→输出→下游），参考 docs/system/AGENT_DESIGN_TEMPLATE.md 和已完成的 6 个 agent。每次补齐 2-3 个，不要一次全做"
    priority: P2
    task_type: execute
    context_files: "docs/system/AGENT_DESIGN_TEMPLATE.md"

  - id: gateway-heartbeat-verify
    agent: agents/EMP_0002/config.md
    line: 自治线
    backlog_match: "Gateway heartbeat 实际验证"
    description: "验证 Gateway heartbeat 是否正确遵循三层行为空间（🟢自主/🟡审批/🔴禁止）。检查最近的 gateway.log 和 gateway-memory.jsonl，确认 Sonnet 行为符合 MASONHUB.md 定义"
    priority: P1
    task_type: query
    context_files: "MASONHUB.md"

  - id: repair-e2e-verify
    agent: agents/EMP_0002/config.md
    line: 自治线
    backlog_match: "Repair session 端到端验证"
    description: "端到端验证 Repair Session 链路。用 python3 scripts/submit-repair.py submit 注入一个测试修复请求，然后运行 bash scripts/repair-dispatch.sh 验证 claude -p 能否正确执行修复流程"
    priority: P1
    task_type: execute
    max_duration: 900

  # === 数据线 ===
  - id: unit-tests
    agent: agents/EMP_0002/config.md
    line: 数据线
    backlog_match: "关键函数单元测试"
    description: "为关键函数编写单元测试：parse_count()、interaction_score()、假流量过滤逻辑。防回归 bug。测试文件放 tests/"
    priority: P1
    task_type: execute
    verify_command: "cd ~/mason-hub && python3 -m pytest tests/ -q 2>&1 | tail -1 | grep -q 'passed'"
    output_path: "tests/"
    context_files: "skills/xhs/_xhs_analyze_compare.py"

  - id: health-fix
    agent: agents/EMP_0014/config.md
    line: 数据线
    backlog_match: "data_health_check 数据集修复"
    description: "运行 bash data/pipelines/data_health_check.sh，修复报告中的异常数据集（非全绿项）"
    priority: P1
    tier: T1
    tier_script: "bash data/pipelines/data_health_check.sh"
    tier_escalate_on_fail: true
    task_type: lightweight
    verify_command: "bash data/pipelines/data_health_check.sh 2>&1 | grep -c FAIL | grep -q '^0$'"
    context_files: "data/data_catalog.yaml,data/pipelines/data_health_check.sh"

  # === 内容线 ===
  - id: socialmesh-content-status
    agent: agents/EMP_0009/config.md
    line: 内容生产线
    backlog_match: "Content.status 发布后更新"
    description: "在 SocialMesh 后端，publish_post 成功后更新 Content.status 为 published。找到 publish 相关的代码路径，添加状态更新逻辑"
    priority: P1
    task_type: execute
    expected_output: "publish_post 函数中增加 Content.status = published 更新"

  - id: socialmesh-chinese
    agent: agents/EMP_0009/config.md
    line: 内容生产线
    backlog_match: "界面中文化"
    description: "SocialMesh 界面中文化，先硬编码中文替换英文 UI 文本。从导航栏和主要页面标题开始"
    priority: P2
    task_type: execute

  - id: socialmesh-publish-button
    agent: agents/EMP_0009/config.md
    line: 内容生产线
    backlog_match: "立即发布"
    description: "在 SocialMesh 前端增加'立即发布'按钮，后端已支持 publish API，前端补上按钮和调用逻辑"
    priority: P2
    task_type: execute

  - id: socialmesh-draft-list
    agent: agents/EMP_0009/config.md
    line: 内容生产线
    backlog_match: "内容列表/草稿管理"
    description: "SocialMesh 内容列表和草稿管理。后端 API 已有但前端未接，增加内容列表页或编辑器左侧列表"
    priority: P2
    task_type: execute

  # === Scout ===
  - id: scout-v2-cron
    agent: agents/EMP_0002/config.md
    line: 自治线
    backlog_match: "Scout v2 cron 注册"
    description: "注册 Scout v2 管道到 crontab，替换旧 scout-*.sh cron。入口: python -m intel.engines.pipeline。建议每周二/五 19:00 ET 运行"
    priority: P1
    task_type: execute
    verify_command: "crontab -l 2>/dev/null | grep -q 'intel.engines.pipeline'"

  - id: emp0006-update
    agent: agents/EMP_0002/config.md
    line: 自治线
    backlog_match: "EMP_0006.md 更新"
    description: "更新 agents/EMP_0006/config.md，加入 Scout v2 Engine 架构职责描述。参考 docs/plans/2026-03-10-scout-v2-design.md 和 intel/engines/ 代码结构"
    priority: P2
    task_type: execute
    context_files: "docs/plans/2026-03-10-scout-v2-design.md"
