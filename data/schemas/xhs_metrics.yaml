# XHS 指标定义 — 唯一口径
#
# 此文件是指标公式的机器可读定义。
# data_catalog.yaml 的 metrics 部分是面向人类的简写。
# data/tools/metrics.py 是代码实现。
# 三者必须保持一致。
#
# 维护者：EMP_0014
# 修改任何指标前必须：
#   1. 评估下游影响（grep consumers 列表）
#   2. 在此文件和 metrics.py 同时更新
#   3. 通知受影响的消费者 agent
#   4. 更新 data_catalog.yaml metrics 部分

metrics:
  interaction_score:
    name: 互动评分
    version: "1.0"
    formula:
      expression: "liked + collected * 3 + comment * 5 + shared * 8"
      weights:
        liked: 1
        collected: 3
        comment: 5
        shared: 8
    input_fields:
      - name: liked
        source_column: liked_count
        type: int
        preprocessing: parse_count
      - name: collected
        source_column: collected_count
        type: int
        preprocessing: parse_count
      - name: comment
        source_column: comment_count
        type: int
        preprocessing: parse_count
      - name: shared
        source_column: share_count
        type: int
        preprocessing: parse_count
    output:
      type: int
      unit: "分（无量纲）"
      range: "[0, +∞)"
    rationale: |
      权重设计思路：
      - 点赞（×1）：成本最低的行为，信号弱
      - 收藏（×3）：用户认为内容有参考价值
      - 评论（×5）：用户愿意花时间表达，信号强
      - 转发（×8）：用户愿意把内容关联到自己社交形象，信号最强

  engage_rate:
    name: 评赞比
    version: "1.0"
    formula:
      expression: "comment / liked * 100"
      special_case: "liked <= 0 → 0.0"
    output:
      type: float
      unit: "%"
      precision: 2  # 保留 2 位小数
    thresholds:
      high: 2.0  # >2% 视为高评赞比
      fake_low: 0.2  # <0.2% 且 liked > 1000 → 假流量嫌疑

  save_rate:
    name: 藏赞比
    version: "1.0"
    formula:
      expression: "collected / liked * 100"
      special_case: "liked <= 0 → 0.0"
    output:
      type: float
      unit: "%"
      precision: 1  # 保留 1 位小数
    thresholds:
      high: 30.0  # >30% 视为高干货
      fake_low: 5.0  # <5% 且 liked > 1000 → 假流量嫌疑

  share_rate:
    name: 转赞比
    version: "1.0"
    formula:
      expression: "shared / liked * 100"
      special_case: "liked <= 0 → 0.0"
    output:
      type: float
      unit: "%"
      precision: 1

  fake_traffic_flag:
    name: 假流量标记
    version: "1.0"
    rules:
      - condition: "liked > 1000 AND engage_rate < 0.2"
        flag: "评赞比过低"
      - condition: "liked > 1000 AND save_rate < 5"
        flag: "藏赞比过低"
    output:
      type: "list[str]"
      description: "空列表 = 正常；非空 = 可疑标记"

  keyword_competition:
    name: 关键词竞争密度
    version: "1.0"
    rules:
      - condition: "count < 5 AND avg_score > global_median"
        result: "蓝海"
        description: "样本少但质量高 — 机会区"
      - condition: "count > 15"
        result: "红海"
        description: "样本多 — 竞争激烈"
      - condition: "count >= 5 AND avg_score < global_median * 0.5"
        result: "红海"
        description: "样本中等但质量低 — 内卷区"
      - condition: "else"
        result: "待观察"
    input_fields:
      - name: count
        description: 该关键词下的笔记数
      - name: avg_score
        description: 该关键词下的平均 interaction_score
      - name: global_median
        description: 全局 interaction_score 中位数

  parse_count:
    name: 中文数字归一化
    version: "1.0"
    rules:
      - pattern: "含 '万'"
        action: "float(去'万') × 10000 → int"
      - pattern: "含 '亿'"
        action: "float(去'亿') × 100000000 → int"
      - pattern: "含 '+'"
        action: "去除 '+' 后正常解析"
      - pattern: "None"
        action: "返回 0"
      - pattern: "其他"
        action: "int() 转换，失败返回 0"
