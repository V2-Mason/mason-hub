# 汇报 Schema — Agent 完成任务后写入 /data/reports/YYYY-MM-DD/
#
# 文件名: {agent_id}_{timestamp}.json

fields:
  agent_id:
    type: string
    required: true
    example: "EMP_0005"

  task_id:
    type: string
    required: true
    description: backlog 任务标识或自由描述
    example: "searxng-docker-deploy"

  timestamp:
    type: string
    format: ISO 8601
    required: true

  status:
    type: string
    enum: [success, failed, partial]
    required: true

  level:
    type: integer
    enum: [0, 1, 2, 3]
    required: true

  summary:
    type: string
    required: true
    description: 一句话描述做了什么
    example: "SearXNG Docker 容器部署完成，localhost:1200 可访问"

  changes:
    type: array
    items: string
    required: false
    description: 修改的文件列表
    example: ["docker-compose.yml", "scripts/start-searxng.sh"]

  blockers_found:
    type: array
    items: string
    required: false
    description: 新发现的阻断

  blockers_resolved:
    type: array
    items: string
    required: false
    description: 解决的阻断

  next_steps:
    type: array
    items: string
    required: false

  metrics:
    type: object
    required: false
    description: 执行指标（耗时、token 数等）
