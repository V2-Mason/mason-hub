# 事件路由表 — event_router.py 的核心配置
#
# 格式: 事件 → 前置条件 + 触发动作
# event_router 收到事件后查此表，条件满足则触发

routes:

  # === 数据线 ===

  data-sync-complete:
    description: "数据同步完成（阿里云 → GCP mirror）"
    preconditions:
      - check: health_check_green
        description: "data_health_check 无 ❌"
    actions:
      - type: script
        target: "skills/xhs-analyze.sh"
        description: "触发 XHS 数据分析"
      - type: event
        target: "data-fresh"
        description: "标记数据已刷新，下游可消费"

  health-check-all-green:
    description: "data_health_check 全部通过"
    preconditions: []
    actions:
      - type: update_system_map
        target: "数据线"
        new_status: "active"
        description: "数据线从 blocked → active"
      - type: check_pending
        description: "检查 pending 目录，释放等待数据线的任务"

  health-check-failed:
    description: "data_health_check 出现 ❌"
    preconditions: []
    actions:
      - type: update_system_map
        target: "数据线"
        new_status: "blocked"
      - type: slack
        channel: "#system-alerts"
        level: 2

  # === Agent 执行 ===

  agent-task-complete:
    description: "Agent 完成了一个 backlog 任务"
    preconditions: []
    actions:
      - type: write_report
        description: "确保汇报写入 /data/reports/"
      - type: check_downstream
        description: "检查是否有下游任务因此解锁"
      - type: slack_if_level_ge_2
        description: "Level >= 2 的直接发 Slack"

  agent-task-failed:
    description: "Agent 任务失败"
    preconditions: []
    actions:
      - type: retry
        max_retries: 2
        description: "自动重试最多 2 次"
      - type: escalate_if_3_failures
        target: "manager"
        description: "连续 3 次失败 → 升级给 Manager"

  # === Scout / 情报 ===

  scout-complete:
    description: "Scout 情报采集完成"
    preconditions:
      - check: health_check_green
    actions:
      - type: script
        target: "data/pipelines/scout-normalize.py"
        description: "标准化情报到 JSONL"
      - type: event
        target: "intel-fresh"
        description: "新情报就绪，optimization-cycle 可消费"

  intel-fresh:
    description: "新情报已标准化入库"
    preconditions: []
    actions:
      - type: script
        target: "scripts/optimization-cycle.sh"
        description: "触发自优化周期"

  # === 内容线 ===

  content-created:
    description: "Content Creator 产出新内容"
    preconditions: []
    actions:
      - type: notify_agent
        target: "EMP_0008"
        description: "通知 SocialMesh PM 内容就绪，可安排发布"

  brief-updated:
    description: "Account Manager 更新了品牌 brief"
    preconditions: []
    actions:
      - type: notify_agent
        target: "EMP_0008"
        description: "通知 PM brief 有变更"
      - type: notify_agent
        target: "EMP_0010"
        description: "通知 Creator brief 有变更"

  # === 阻断解除 ===

  blocker-resolved:
    description: "某个 blocker 被解决"
    preconditions: []
    actions:
      - type: update_system_map
        description: "更新对应能力线阻力列表"
      - type: check_pending
        description: "检查 pending 目录，释放等待此 blocker 的任务"
      - type: slack
        channel: "#system-alerts"
        level: 2

  # === 外部条件到达 ===

  external-dependency-met:
    description: "硬性等待项条件满足（Mason 标记）"
    preconditions: []
    actions:
      - type: update_system_map
        description: "从硬性等待项移除"
      - type: check_pending
        description: "释放等待此条件的任务"
      - type: slack
        level: 1
