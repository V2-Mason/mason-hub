# workflow_state.yaml — v1.1 §7.3 Workflow 实例状态 schema
#
# 每个 workflow 实例在 data/workflows/wf-{date}-{name}-{id}/ 下
# 有一个 state.yaml 文件记录执行进度

schema_version: 1
description: Workflow instance state for checkpoint/resume

fields:
  workflow_id:
    type: string
    format: "wf-{YYYYMMDD}-{name}-{3digit}"
    required: true

  template:
    type: string
    description: shared/workflows/ 中的模板文件名
    required: true

  account:
    type: string
    default: surenxuan
    required: true

  status:
    type: enum
    values: [pending, in_progress, awaiting_approval, completed, failed, timed_out]
    required: true

  created_at:
    type: datetime
    required: true

  updated_at:
    type: datetime
    required: true

  current_step:
    type: string
    description: 当前正在执行或等待的 step ID
    required: false

  trigger_input:
    type: object
    description: 启动时的输入参数
    required: false

  steps:
    type: map
    description: 每个 step 的状态记录
    value_schema:
      status:
        type: enum
        values: [pending, in_progress, done, failed, awaiting_approval, skipped, timed_out]
      instance_id:
        type: string
        description: 执行该 step 的 session instance_id
      output:
        type: string
        description: 产出 artifact 的相对路径
      started_at:
        type: datetime
      completed_at:
        type: datetime
      error:
        type: string
        description: 失败时的错误信息

lifecycle:
  create: workflow-engine.py（启动 workflow 时创建）
  update: workflow-engine.py（每个 step 完成/失败时更新）
  read: dispatcher.sh（每轮扫描时读取，推进下一步）
