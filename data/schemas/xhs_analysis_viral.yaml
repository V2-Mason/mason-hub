# XHS 互动分析 Schema — analysis_xhs_viral
#
# Layer 3 (Analysis) 输出格式定义
# 输入: clean_xhs_notes (目标) / raw_xhs_notes (当前)
# 输出: JSON 对象，包含 meta + top_posts + keyword_insights + patterns
#
# 维护者: EMP_0014
# 产出脚本: skills/xhs/xhs-analyze-viral.py

schema:
  type: object
  required: [meta, top_posts, keyword_insights, patterns, content_type, fake_traffic]
  properties:

    meta:
      type: object
      description: 本期分析元数据
      properties:
        date:
          type: string
          format: "YYYY-MM-DD"
        total_notes:
          type: integer
        video_count:
          type: integer
        normal_count:
          type: integer
        age_distribution:
          type: object
          properties:
            min_age_days: { type: integer }
            max_age_days: { type: integer }
            median_age_days: { type: integer }
            within_30d: { type: integer }
            within_7d: { type: integer }
            older_than_90d: { type: integer }

    top_posts:
      type: array
      description: 互动分 Top 20 帖子
      max_items: 20
      items:
        type: object
        required: [title, score, type, liked, collected, comment, shared, save_rate, engage_rate, url]
        properties:
          title: { type: string }
          score:
            type: integer
            metric_ref: interaction_score
          type: { type: string, enum: [video, normal] }
          liked: { type: integer }
          collected: { type: integer }
          comment: { type: integer }
          shared: { type: integer }
          save_rate:
            type: number
            metric_ref: save_rate
          engage_rate:
            type: number
            metric_ref: engage_rate
          share_rate:
            type: number
            metric_ref: share_rate
          url: { type: string }
          nickname: { type: string }
          user_id: { type: string }
          pub_date: { type: string }
          post_age_days: { type: integer }
          content_tier: { type: string }
          fake_flags:
            type: array
            items: { type: string }
            metric_ref: fake_traffic_flag

    keyword_insights:
      type: array
      description: 按搜索关键词聚合的统计
      items:
        type: object
        required: [keyword, count, avg_score, competition]
        properties:
          keyword: { type: string }
          count: { type: integer }
          avg_score: { type: number }
          top_score: { type: integer }
          video_ratio: { type: number }
          top_title: { type: string }
          top_url: { type: string }
          competition:
            type: string
            enum: ["蓝海", "红海", "待观察"]
            metric_ref: keyword_competition

    patterns:
      type: object
      description: 高指标帖子分组（liked > 1000 才入围）
      properties:
        high_save:
          type: array
          description: "save_rate > 30% 的帖子"
          items:
            type: object
            properties:
              title: { type: string }
              save_rate: { type: number }
              score: { type: integer }
              url: { type: string }
        high_engage:
          type: array
          description: "engage_rate > 2% 的帖子"
          items:
            type: object
            properties:
              title: { type: string }
              engage_rate: { type: number }
              score: { type: integer }
              url: { type: string }
        high_share:
          type: array
          description: "share_rate > 3% 的帖子"
          items:
            type: object
            properties:
              title: { type: string }
              share_rate: { type: number }
              score: { type: integer }
              url: { type: string }

    content_type:
      type: object
      description: 按内容类型（视频/图文）的平均分对比
      properties:
        video_avg_score: { type: number }
        normal_avg_score: { type: number }
        video_ratio: { type: number, description: "视频占比 %" }

    title_patterns:
      type: object
      description: 标题特征与互动分的关系
      properties:
        with_number_avg: { type: number }
        without_number_avg: { type: number }
        with_exclaim_avg: { type: number }

    fake_traffic:
      type: object
      description: 假流量检测结果
      properties:
        count: { type: integer }
        posts:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              liked: { type: integer }
              save_rate: { type: number }
              engage_rate: { type: number }
              url: { type: string }

# 输出约定
output:
  format: json
  filename_pattern: "analysis_YYYY-MM-DD.json"
  location: "aliyun:/opt/mediacrawler/analysis/"
  encoding: utf-8
