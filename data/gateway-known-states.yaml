# Gateway 已知状态注册表
#
# Mason 确认的系统状态，Gateway heartbeat 遇到匹配项时跳过，不升级告警。
# 由 Session Operator 在 /commit 时维护，expires 到期自动失效。
#
# 格式:
#   - id: 唯一标识（kebab-case）
#     date: 确认日期
#     decision: Mason 说了什么
#     impact: 对 Gateway 行为的影响（遇到什么情况跳过）
#     expires: 过期日期（超过此日期视为失效，Gateway 恢复正常告警）

