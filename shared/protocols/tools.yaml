# tools.yaml — 通用工具协议
# 源文件: tools.md (2026-03-12)

id: tools
version: "1.0"
type: global
description: "跨 Agent 共享的通用工具使用规范"

changelog:
  - version: "1.0"
    date: "2026-03-14"
    change: "从 markdown 转为声明式 YAML"

tools:
  semantic_snapshot:
    desc: "网页内容提取（优先于直接抓 HTML）"
    command: 'python3 ~/mason-hub/skills/semantic_snapshot.py "{url}" --max-chars 6000'
    options:
      - "--no-js: 轻量模式（不启动浏览器）"
      - "--json: 结构化输出"
    notes: "比原始 HTML 压缩 10x+，中文完全支持"
