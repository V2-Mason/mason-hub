# agent-log-schema.yaml — agent.log 结构化日志 Schema
# 源文件: agent-log-schema.md (2026-03-12)

id: agent-log-schema
version: "1.0"
type: global
owner: EMP_0002
description: "agent.log JSONL 格式定义、事件类型、日志轮转规则"

changelog:
  - version: "1.0"
    date: "2026-03-14"
    change: "从 markdown 转为声明式 YAML"

base_fields:
  timestamp: {type: string, format: "ISO 8601 UTC"}
  agent_id: {type: string, example: "EMP_0001"}
  task_id: {type: string, format: "task_{agent}_{epoch}"}
  event_type: {type: string, enum: [start, info, output, verify, error, crash, self-eval, efficiency-alert, skill-search, end]}
  elapsed_s: {type: number}
  message: {type: string, max_length: 500}

event_types:
  start: {desc: "任务开始", extra: [work_dir, has_verify, task_type, chain_depth]}
  info: {desc: "信息性", extra: [round, max_rounds]}
  output: {desc: "Agent 产出", extra: [round, output_bytes, duration]}
  verify: {desc: "验证结果", extra: [round, exit_code]}
  self-eval: {desc: "自评估", extra: [verify_exit, verify_cmd]}
  efficiency-alert: {desc: "效率异常", extra: [ratio, input_tokens, output_tokens, cost]}
  error: {desc: "错误", extra: "自由扩展"}
  crash: {desc: "异常退出"}
  end: {desc: "任务结束"}

rotation:
  max_size_bytes: 1048576  # 1MB
  archive_format: "agent.log.{timestamp}.gz"
  max_archives: 5
  write_function: "log_structured() in run-agent.sh"
  rule: "禁止直接 echo >> agent.log"

related_files:
  - {file: "logs/audit.jsonl", granularity: "任务级", purpose: "成本/结果审计"}
  - {file: "logs/tasks/", granularity: "完整原始 JSON", purpose: "Debug 用"}
