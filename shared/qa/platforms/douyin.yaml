# 抖音平台参数 — Layer 2
# 最后更新: 2026-03-09
# 来源: 抖音创作者服务中心

video:
  max_duration_seconds: 900
  min_duration_seconds: 3
  max_file_size_mb: 4096
  min_width: 540
  min_height: 960
  recommended_ratio: "9:16"
  supported_formats: "mp4,mov"

text:
  max_title_chars: 55
  max_body_chars: 3000
  max_hashtags: 5

image:
  max_images: 12
  max_file_size_mb: 20
  min_width: 480
  min_height: 480

forbidden_words:
  list: "最好,最佳,第一,国家级,绝对,100%,永久,万能,祛斑,速效,立竿见影,根治,药妆"

compliance:
  nmpa_required: true
  brand_authorization_required: true
