# skills/registry.yaml — Skill 索引
#
# Agent 通过此索引知道"有哪些工具可用"，按需调用。
# 每个 skill 只放 description + entry，不放实现细节。
#
# 格式：
#   name:
#     description: 一句话说明
#     entry: 调用入口（bash/python 脚本路径）
#     type: script | skill-md | external
#     input: [参数列表]
#     output: 输出格式

# === 运维/监控 ===
health-check:
  description: "系统健康检查（GCP + 阿里云 + Agent 进程）"
  entry: scripts/health-check-lite.sh
  type: script
  output: text

data-health-check:
  description: "数据集健康检查（17 个数据集新鲜度/可达性）"
  entry: data/pipelines/data_health_check.sh
  type: script
  input: [--slack]
  output: text

agent-status-report:
  description: "Agent 运行状态报告"
  entry: skills/monitoring/agent-status-report.sh
  type: script
  input: [--slack, channel_id]
  output: text

# === 部署 ===
deploy:
  description: "部署 surenxuan 到阿里云生产环境"
  entry: skills/deploy/deploy-to-aliyun.sh
  type: script
  input: [--git]
  output: text

# === 数据管道 ===
data-sync:
  description: "阿里云→GCP 数据同步（SQLite backup + scp）"
  entry: data/pipelines/data-sync.sh
  type: script
  output: text

xhs-pipeline:
  description: "XHS 主干管道（采集→同步→分析→策略）"
  entry: skills/xhs/xhs-pipeline.sh
  type: script
  output: text

xhs-crawl:
  description: "XHS 采集（4 类任务 × 多账号）"
  entry: skills/xhs/xhs-crawl.sh
  type: script
  input: [--task, "1-4", --account, "A|B"]
  output: text

xhs-analyze:
  description: "XHS 爆文分析（互动评分 + 假流量过滤）"
  entry: skills/xhs/xhs-analyze.sh
  type: script
  output: json

xhs-strategy-briefing:
  description: "XHS 策略简报（内容分类 + 建议）"
  entry: skills/xhs/xhs-strategy-briefing.sh
  type: script
  output: text

# === 情报 ===
scout-v2:
  description: "Scout v2 情报管道（6 引擎：spider→query→media→insight→forum→report）"
  entry: python -m intel.engines.pipeline
  type: script
  input: [--resume, --force]
  output: json+markdown

trendradar:
  description: "热榜 + RSS 广度采集"
  entry: python -m trendradar
  type: script
  output: sqlite

# === Agent 运维 ===
compact-memory:
  description: "记忆压缩（三温度：sessions→warm.md→long_term.md）"
  entry: skills/agent-ops/compact-memory.sh
  type: script
  input: [agent_id | all]
  output: file

optimization-cycle:
  description: "系统优化周期（数据质量 + 效率审查）"
  entry: skills/agent-ops/optimization-cycle.sh
  type: script
  output: text

# === 视频/内容生产 ===
comfyui-kling:
  description: "可灵视频生成（text2video + image2video）"
  entry: skills/video/comfyui-kling-direct/
  type: external
  output: video_file

comfyui-gemini:
  description: "Gemini Direct Pro 节点（多模态理解）"
  entry: skills/video/comfyui-gemini-direct/
  type: external
  output: json

# === 工具 ===
drive-upload:
  description: "上传文件到 Google Drive"
  entry: .claude/skills/drive-upload/SKILL.md
  type: skill-md
  output: url

notify-mason:
  description: "通知 Mason（Slack webhook）"
  entry: skills/notify-mason.sh
  type: script
  input: [title, message, level]
  output: none

emit-event:
  description: "发射事件到 event router"
  entry: scripts/emit_event.sh
  type: script
  input: [event_type, source, severity, priority, payload_json]
  output: file

cookie-reminder:
  description: "XHS Cookie 过期提醒"
  entry: scripts/cookie-reminder.sh
  type: script
  output: text
