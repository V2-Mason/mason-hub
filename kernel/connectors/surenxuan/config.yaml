# Connector: surenxuan
# 素仁轩 K-Beauty 零售管理系统

project: surenxuan
project_path: /home/hangn/surenxuan
adapter_path: /home/hangn/surenxuan/.mason/adapter.yaml

connection:
  type: api
  endpoint: http://localhost:8000
  auth: none  # 本地运行，无需认证

tech_stack:
  backend: FastAPI + SQLite
  frontend: React + Tailwind

# mason-hub 标准 schema → surenxuan 内部格式的映射
schema_mappings:
  inventory:
    source_table: products  # surenxuan 的库存在 products 表
    field_map:
      sku: sku_code
      quantity: stock_quantity
      # 详细映射在 transforms.py 中实现
  product:
    source_table: products
  order:
    source_table: sales

notes: |
  surenxuan 当前有 P0 bug（折扣计算、退换货、库存补货差异）。
  connector 实际对接应在 P0 修复后进行。
