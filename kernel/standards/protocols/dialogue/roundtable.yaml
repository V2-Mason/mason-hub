# roundtable.yaml — v1.1 §8.4 多角色挑战协议
#
# 多个角色各自独立表态 → 强制互相挑战 → 修正立场。
# 三阶段结构防止锚定偏见和虚假共识。

id: roundtable
version: "1.0"
type: roundtable
description: "多角色独立表态 → 强制挑战 → 修正立场，产出共识或分歧报告"

config:
  participants: []           # [EMP_XXXX, ...] 运行时填入
  max_rounds: 2              # 通常 1-2 轮足够
  require_min_challenges: 1  # 每人至少挑战 1 个他人观点

phases:
  phase_1_independent:
    name: "独立表态"
    description: "每个参与者独立陈述立场，不看他人观点"
    output_fields:
      - position: "核心立场（1-3 句）"
      - evidence: "支持证据（数据/经验/文档引用）"
      - risk_if_ignored: "如果忽略此立场的风险"
      - confidence: "1-10 分"
    isolation: true  # 参与者之间看不到彼此的输出

  phase_2_challenge:
    name: "强制挑战"
    description: "每个参与者必须挑战至少一个他人的立场"
    output_fields:
      - target: "被挑战的参与者 ID"
      - challenge: "反证据或反论点"
      - weakness_identified: "对方立场的薄弱环节"
    mandatory: true  # 不能跳过，不能全部同意

  phase_3_revision:
    name: "修正立场"
    description: "看到挑战后修正自己的立场"
    output_fields:
      - revised_position: "修正后的立场"
      - concessions: "做出的让步（接受了谁的挑战）"
      - maintained: "维持的观点（为什么挑战不成立）"
      - final_confidence: "1-10 分"

convergence_check: |
  收敛条件：所有参与者的 revised_position 不存在直接矛盾。
  如果仍有矛盾 → 生成分歧报告，不强制达成虚假共识。

divergence_report:
  format: |
    ## Roundtable 分歧报告
    - 参与者: [list]
    - 达成共识: [points]
    - 核心分歧: [{topic, positions: [{participant, position, evidence}]}]
    - 每个分歧点的建议决策方向
  destination: escalate_to_mason

anti_sycophancy:
  - "Phase 2 是强制性的——每个参与者必须至少挑战一个观点"
  - "如果某人在 Phase 2 表示'全部同意' → 系统拒绝，要求重新提交"
  - "Phase 3 中 concessions 为空 → 警告，要求解释为什么所有挑战都不成立"
