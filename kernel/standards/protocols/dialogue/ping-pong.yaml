# ping-pong.yaml — v1.1 §8.2 Creator ↔ Reviewer 协议
#
# 两个角色交替：一个产出，一个评审。角色固定，方向交替。
# Anti-sycophancy：评审标准从外部 checklist 注入，不由 session 内生成。

id: ping-pong
version: "1.0"
type: ping_pong
description: "Creator 产出 → Reviewer 评审 → 循环直到通过或达到上限"

config:
  roles:
    creator: ""              # EMP_XXXX，运行时填入
    reviewer: ""             # EMP_XXXX，运行时填入
  max_rounds: 4
  termination: reviewer_passes | max_rounds_escalate
  reviewer_checklist: ""     # shared/qa/ 下的检查清单路径
  reviewer_modality: text    # text | multimodal（multimodal 用 Gemini）

turn_format:
  creator_turn:
    output_fields:
      - artifact: "产出内容（文件路径或 markdown）"
      - self_assessment: "自评（1-10 分 + 理由）"
      - changes_from_last: "相比上轮改了什么（首轮留空）"

  reviewer_turn:
    output_fields:
      - verdict: pass | fail
      - score: "1-10 分"
      - issues: "[{category, description, severity, suggestion}]"
      - must_fix: "必须修复的项目列表（fail 时必填）"

boundary_marker: |
  [PHASE COMPLETE: {role}_turn_{round}]
  Output saved to: {artifact_path}
  [PHASE START: {next_role}_turn_{round}]
  Role context: {next_role_name}
  Previous role instructions no longer apply.
  Your checklist: {checklist_content}

anti_sycophancy:
  - "Reviewer 的评判标准从 reviewer_checklist 文件注入，不是 session 内生成"
  - "Reviewer 不能被 Creator 的自评影响——先读 checklist，再看产出，最后看自评"
  - "score < 7 必须标 fail，不能因为 Creator 努力了就放水"

escalation:
  max_rounds_reached: "生成分歧报告（哪些问题反复出现），escalate 给 Manager"
  reviewer_consecutive_fail_3: "检查是否是 checklist 标准过高，建议 Mason 调整"
