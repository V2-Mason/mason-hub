# escalation.yaml — PM 失败评估与升级协议
# 源文件: escalation.md (2026-03-12)

id: escalation
version: "1.0"
type: global
description: "PM 角色的失败评估、分类、重试与升级标准流程"

changelog:
  - version: "1.0"
    date: "2026-03-14"
    change: "从 markdown 转为声明式 YAML"

triggers:
  - condition: "预算或付费决策"
    action: escalate_to_mason
  - condition: "修改 knowledge_base.md 业务规则"
    action: escalate_to_mason
  - condition: "Dev 连续两次 task_failed 同一任务"
    action: evaluate_failure_type
  - condition: "合规问题（API ToS / NMPA / 进口资质）"
    action: escalate_to_mason
  - condition: "不确定任务目标"
    action: escalate_to_mason

failure_types:
  A:
    name: "简单 bug"
    desc: "语法错误、拼写错误、缺少 import"
    action: reassign_to_dev
  B:
    name: "逻辑错误"
    desc: "算法/业务逻辑实现有误"
    action: reassign_to_dev
  C:
    name: "架构/依赖问题"
    desc: "需要改 schema、配置、基础设施"
    action: escalate_to_platform_dev
  D:
    name: "测试本身有问题"
    desc: "测试用例不合理或环境问题"
    action: escalate_to_platform_dev
  E:
    name: "需求不清晰"
    desc: "任务目标有歧义"
    action: escalate_to_mason

retry_rules:
  max_pm_retries: 2
  check_command: "skills/monitoring/check-escalation.sh --task {task_id}"
  check_field: "can_retry"
  escalate_target: "EMP_0002"

action_format:
  reassign_to_dev:
    output: 'ACTION:{"type":"reassign_to_dev","task_id":"{task_id}","new_task":"{desc}","retry_count":{N}}'
  escalate_to_platform_dev:
    output: 'ACTION:{"type":"escalate_to_platform_dev","task_id":"{task_id}","context":"{context}"}'
  escalate_to_mason:
    output: 'ACTION:{"type":"escalate_to_mason","task_id":"{task_id}","context":"{context}","options":[...]}'
  task_complete:
    output: 'ACTION:{"type":"task_complete","task_id":"{task_id}","summary":"{summary}"}'

forbidden:
  - "不跑 check-escalation.sh 就盲目重分配"
  - "can_retry=false 时仍给 Dev"
  - "跳过 Platform Dev 直报 Mason（除 E 类）"
  - "隐瞒失败次数"
  - "原样退回任务不调整"
