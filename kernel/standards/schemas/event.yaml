# 事件 Schema — 所有事件写入 /data/events/queue.jsonl
#
# 每行一条 JSON，inotify 或 dispatcher 消费

fields:
  event:
    type: string
    required: true
    description: 事件类型标识符（见 routing_table.yaml）
    example: "data-sync-complete"

  source:
    type: string
    required: true
    description: 产生事件的脚本或 agent
    example: "data-sync.sh"

  timestamp:
    type: string
    format: ISO 8601
    required: true
    example: "2026-03-10T14:30:00+08:00"

  status:
    type: string
    enum: [ok, warning, failed]
    required: true

  level:
    type: integer
    enum: [0, 1, 2, 3]
    required: true
    description: |
      0 = 静默（只写日志）
      1 = 聚合上报（写 report，briefing 呈现）
      2 = 主动通知（直接发 Slack）
      3 = 需要决策（Slack + /standup 待确认）

  data:
    type: object
    required: false
    description: 事件附加数据，按事件类型不同
    example: { "rows_synced": 150, "datasets_healthy": 12 }

  agent_id:
    type: string
    required: false
    description: 产生事件的 Agent ID（脚本产生时可为空）
    example: "EMP_0008"

# 写入示例（bash 单行）:
# echo '{"event":"data-sync-complete","source":"data-sync.sh","timestamp":"'$(date -Iseconds)'","status":"ok","level":1,"data":{"rows":150}}' >> /data/events/queue.jsonl
