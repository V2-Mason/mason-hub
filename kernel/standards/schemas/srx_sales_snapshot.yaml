# 素仁轩销售快照 Schema
# 维护者：EMP_0014 (Data Engineer)
# 消费者：EMP_0001（素仁轩 PM）, EMP_0008（内容运营）, data-coo-daily.sh
# 版本：1.0 (2026-03-11)
#
# 设计思路：
#   - 每次快照调用 3 个 API 端点，结果存入 3 张 SQLite 表
#   - snapshot_id + snapshot_date 构成时序维度
#   - 支持日级趋势分析（环比/同比）和因果推断（内容发布 → 销售变化）

# =============================================================================
# 表 1: sales_snapshots — 销售摘要快照
# =============================================================================
# 来源: GET /api/sales/summary
# 频率: 每日 1 次（20:00 ET，与 data-coo-daily.sh 同步）

sales_snapshots:
  fields:
    - name: snapshot_id
      type: TEXT
      primary_key: true
      description: "唯一标识，格式: sales_YYYY-MM-DD"
      example: "sales_2026-03-11"

    - name: snapshot_date
      type: TEXT
      required: true
      description: "快照日期 YYYY-MM-DD（ET 时区）"
      index: true

    - name: snapshot_ts
      type: TEXT
      required: true
      description: "快照时间戳 ISO 8601（UTC）"

    - name: total_revenue
      type: REAL
      required: false
      description: "总营收（元），API 字段: total_revenue 或 total"

    - name: total_orders
      type: INTEGER
      required: false
      description: "总订单数，API 字段: total_orders 或 count"

    - name: raw_response
      type: TEXT
      required: true
      description: "API 原始 JSON 响应（完整保留，防止信息丢失）"

# =============================================================================
# 表 2: dashboard_snapshots — 仪表盘概览快照
# =============================================================================
# 来源: GET /api/dashboard/overview
# 频率: 同上

dashboard_snapshots:
  fields:
    - name: snapshot_id
      type: TEXT
      primary_key: true
      description: "唯一标识，格式: dash_YYYY-MM-DD"

    - name: snapshot_date
      type: TEXT
      required: true
      index: true

    - name: snapshot_ts
      type: TEXT
      required: true

    - name: total_inventory
      type: INTEGER
      required: false
      description: "总库存量，API 字段: total_inventory 或 inventory_count"

    - name: total_products
      type: INTEGER
      required: false
      description: "总商品数，API 字段: total_products 或 product_count"

    - name: raw_response
      type: TEXT
      required: true
      description: "API 原始 JSON 响应"

# =============================================================================
# 表 3: risk_snapshots — 风险告警快照
# =============================================================================
# 来源: GET /api/intelligence/risk-alerts
# 频率: 同上

risk_snapshots:
  fields:
    - name: snapshot_id
      type: TEXT
      primary_key: true
      description: "唯一标识，格式: risk_YYYY-MM-DD"

    - name: snapshot_date
      type: TEXT
      required: true
      index: true

    - name: snapshot_ts
      type: TEXT
      required: true

    - name: alert_count
      type: INTEGER
      required: true
      description: "告警总数"

    - name: expiring_count
      type: INTEGER
      required: false
      description: "临期告警数"

    - name: low_stock_count
      type: INTEGER
      required: false
      description: "低库存告警数"

    - name: slow_moving_count
      type: INTEGER
      required: false
      description: "滞销告警数"

    - name: raw_response
      type: TEXT
      required: true
      description: "API 原始 JSON 响应"
