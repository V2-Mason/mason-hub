# task.yaml — Task 标准数据对象 Schema
# Agent OS v2 子系统 5: Task Engine

# 每个任务执行时生成 data/tasks/{task_id}.yaml
# run-agent.sh 在任务开始时创建，结束时更新

required_fields:
  id: {type: string, format: "task_{agent}_{epoch}"}
  account: {type: string, nullable: true, desc: "品牌/账户 ID（如 surenxuan），无则为平台任务"}
  agent: {type: string, desc: "执行 agent ID（如 EMP_0002）"}
  assigned_by: {type: string, desc: "派发来源（dispatcher / mason / EMP_XXXX）"}
  status: {type: string, enum: [created, assigned, in_progress, verifying, done, failed, escalated]}
  description: {type: string, desc: "任务描述"}
  created_at: {type: string, format: "ISO 8601"}
  updated_at: {type: string, format: "ISO 8601"}

optional_fields:
  depends_on: {type: list, desc: "前置任务 ID 列表"}
  acceptance_criteria: {type: string, desc: "验收标准"}
  verify_command: {type: string, desc: "验证命令"}
  input_files: {type: list, desc: "输入文件列表"}
  output_path: {type: string, desc: "输出文件路径"}
  result: {type: string, desc: "实际结果摘要"}
  duration_seconds: {type: number}
  cost_usd: {type: number}
  rounds: {type: number, desc: "验证轮次"}
  lessons_extracted: {type: list, desc: "提取的经验列表，每条含 pipe/content/source_task"}
  escalated_to: {type: string, desc: "升级目标 agent"}
  error_summary: {type: string, desc: "失败摘要"}

status_transitions:
  created: [assigned]
  assigned: [in_progress]
  in_progress: [verifying, done, failed]
  verifying: [done, failed]
  failed: [escalated, assigned]  # 可重新分配
  escalated: [assigned, done]    # Mason 介入后可重分配或关闭
  done: []  # 终态
