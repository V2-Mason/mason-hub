# Scout 情报条目标准 schema
# 维护者：EMP_0014 (Data Engineer)
# 消费者：optimization-cycle.sh, EMP_0000（晨会）, 下游分析管道
# 版本：1.0 (2026-03-10)

fields:
  - name: id
    type: string
    required: true
    description: "唯一标识，格式: YYYY-MM-DD-<source>-<序号>"
    example: "2026-03-08-scout-github-001"

  - name: date
    type: string  # ISO 8601
    required: true
    description: "情报发现日期（从 digest 文件名或正文提取）"
    example: "2026-03-08"

  - name: source
    type: string
    required: true
    enum:
      - scout-github
      - scout-anthropic
      - scout-trending
      - scout-ecom-compete
      - scout-find-skill
      - scout-products
      - scout-search-topic
      - scout-ui-inspiration
      - scout-xhs-trends
      - mixed  # digest 未标明单一来源时
    description: "情报来源脚本"

  - name: priority
    type: string
    required: true
    enum: [red, yellow, info]
    description: "🔴=red 需要行动, 🟡=yellow 值得了解, ℹ️=info 纯记录"

  - name: title
    type: string
    required: true
    description: "情报条目标题（从 ### 标题行提取）"

  - name: summary
    type: string
    required: true
    description: "条目正文摘要（标题下方的内容，去掉结构化字段后的部分）"

  - name: url
    type: string
    required: false
    description: "主要参考链接（第一个 markdown 链接）"

  - name: relevance
    type: string
    required: false
    description: "与 Mason Hub / 素仁轩的关系"

  - name: suggested_action
    type: string
    required: false
    description: "建议行动"

  - name: suggested_owner
    type: string
    required: false
    description: "建议负责人 EMP ID"

  - name: digest_file
    type: string
    required: true
    description: "来源 digest 文件名（用于溯源）"
