# agent_session.yaml — v1.1 Session 记录 schema
#
# 每个 Agent session 产出一个 markdown 文件，frontmatter 遵循此 schema。
# 文件位置：agents/EMP_XXXX/memory/sessions/{instance_id}.md
# Merge 目标：compact-memory.sh → warm.md → long_term.md

schema_version: 1
description: Agent session record (v1.1 Role/Instance model)

fields:
  instance_id:
    type: string
    format: "session-{YYYYMMDD}-{EMP_XXXX}-{4hex}"
    description: 唯一 session 标识，run-agent.sh 启动时生成
    required: true

  role_id:
    type: string
    format: "EMP_XXXX"
    description: 执行此 session 的 Role ID
    required: true

  task_id:
    type: string
    description: 关联的任务 ID（与 audit.jsonl 对应）
    required: true

  status:
    type: enum
    values: [completed, repair_failed, partial, timed_out]
    description: session 最终状态
    required: true

  started_at:
    type: datetime
    format: ISO8601
    required: true

  ended_at:
    type: datetime
    format: ISO8601
    required: true

  duration:
    type: integer
    unit: seconds
    required: false

  rounds:
    type: integer
    description: 验证轮次（仅 dev 类 agent）
    required: false

  account:
    type: string
    description: 品牌上下文（多品牌时用于 merge 过滤）
    required: false
    default: surenxuan

  workflow_id:
    type: string
    description: 关联的 workflow 实例 ID（Phase 3 启用）
    required: false

  step_id:
    type: string
    description: workflow 中的步骤 ID（Phase 3 启用）
    required: false

  schema_version:
    type: integer
    description: schema 版本号，用于向后兼容
    required: true
    default: 1

# body 部分为 markdown 自由格式：
#   - 经验教训（## 日期: 模块名 + 要点）
#   - 失败记录（## [FAILED] task_id + 错误摘要）
#   - 任务总结（简短）

lifecycle:
  write: run-agent.sh（session 结束时原子写入）
  merge: compact-memory.sh（daily cron → warm.md）
  archive: compact-memory.sh（30天后 → archive/YYYY-MM/）
  immutable: true  # session 文件写入后不修改，append-only 审计轨迹
